# Neknihy – web UI + automatické sťahovanie výpožičiek Palmknihy
# Verzia pre Synology Container Manager (nepotrebuje git ani hotový obraz).
#
#   1. Vytvor priečinky /volume1/docker/neknihy/config a /volume1/docker/neknihy/books
#   2. Zisti svoje UID:GID (SSH: `id`), napr. uid=1026 gid=100 → user: "1026:100"
#   3. Container Manager → Projekt → Vytvoriť, vlož tento súbor, uprav riadky označené ←
#   4. Otvor http://<IP-NAS>:8478 → Nastavení → zadaj e-mail a heslo Palmknihy
#
# Aktualizácia na novú verziu: v projekte daj "Build" (alebo cez SSH
# `sudo docker compose build --no-cache && sudo docker compose up -d`).

services:
  neknihy:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 NEKNIHY_WORKDIR=/books NEKNIHY_CONFIG_DIR=/config NEKNIHY_WEB_PORT=8478
        WORKDIR /app
        RUN pip install --no-cache-dir "requests>=2.30.0"
        ADD https://github.com/misko903/neknihy/archive/refs/heads/headless-docker.tar.gz /tmp/src.tar.gz
        RUN tar -xzf /tmp/src.tar.gz -C /tmp \
         && cp -r /tmp/neknihy-headless-docker/src/neknihy /tmp/neknihy-headless-docker/src/neknihy_cli.py /tmp/neknihy-headless-docker/src/neknihy_web.py /app/ \
         && rm -rf /tmp/src.tar.gz /tmp/neknihy-headless-docker \
         && mkdir -p /books /config && chmod 777 /books /config
        EXPOSE 8478
        ENTRYPOINT ["python", "/app/neknihy_web.py"]
    pull_policy: build
    container_name: neknihy
    restart: unless-stopped
    user: "1026:100"              # ← tvoje UID:GID
    ports:
      - "8478:8478"               # ← ľavé číslo zmeň, ak je port obsadený
    environment:
      TZ: "Europe/Bratislava"
      NEKNIHY_WEB_PASSWORD: "zmen-ma"   # ← heslo do webového rozhrania
      # NEKNIHY_LANG: "sk"            # jazyk webu (cs, sk, en, de); inak podľa prehliadača
      # Voliteľné počiatočné hodnoty (dajú sa nastaviť aj vo webe):
      # NEKNIHY_EMAIL: "ty@example.com"
      # NEKNIHY_PASSWORD: "heslo-palmknihy"
    volumes:
      - /volume1/docker/neknihy/config:/config   # nastavenia
      - /volume1/docker/neknihy/books:/books     # stiahnuté knihy
      # Synchronizácia priamo do ingest priečinka Calibre-Web
      # (vo webe potom nastav "Složka pro synchronizaci" na /reader):
      # - /volume1/docker/calibre-web/ingest:/reader
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8478/health')"]
      interval: 60s
      timeout: 5s
