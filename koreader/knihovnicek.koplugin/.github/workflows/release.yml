name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          lua5.1 tests/run.lua
      - name: Build zip with the knihovnicek.koplugin folder
        run: |
          mkdir -p dist/knihovnicek.koplugin
          cp _meta.lua main.lua nk_*.lua LICENSE README.md dist/knihovnicek.koplugin/
          (cd dist && zip -r ../knihovnicek.koplugin.zip knihovnicek.koplugin)
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: knihovnicek.koplugin.zip
          generate_release_notes: true
